<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nod Hun Oth TV™</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .ente {
      width: 100%;
      max-width: 500px;
      text-align: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .logo {
      width: min(80%, 360px);
      height: auto;
      margin-bottom: 40px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .links a {
      display: block;
      padding: 14px;
      color: #fff;
      text-decoration: none;
      border: 1px solid #fff;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .links a:hover {
      background: #fff;
      color: #000;
    }
  </style>
</head>

<body>

  <main class="ente">

    <img
      class="logo"
      src="b5adb467-8ab9-480c-800d-4e778658ad65.png"
      alt="Nod Hun Oth TV™"
    >

    <nav class="links">

      <a
        href="https://www.instagram.com/nodhunoth.tv/"
        target="_blank"
        rel="noopener"
      >
        INSTAGRAM
      </a>

      <a
        href="https://www.tiktok.com/@nod.hun.oth.tv"
        target="_blank"
        rel="noopener"
      >
        TIKTOK
      </a>

      <a
        href="https://www.facebook.com/profile.php?id=61595215197523"
        target="_blank"
        rel="noopener"
      >
        FACEBOOK
      </a>

    </nav>

  </main>

</body>
</html>
